# 本地开发：只起 PostgreSQL。
# 生产/标准部署见 docs/m9-platform-design.md，后续再补 app/worker。
name: asr-eval

services:
  db:
    image: postgres:16-alpine
    container_name: asr-eval-db
    environment:
      POSTGRES_USER: asr
      POSTGRES_PASSWORD: asr
      POSTGRES_DB: asr_eval
    ports:
      # 只绑本机，不暴露到局域网
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asr -d asr_eval"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
