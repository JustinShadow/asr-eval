[project]
name = "asr-eval"
version = "0.1.0"
description = "ASR 模型评测平台"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.2",
  "websockets>=14",
  "httpx>=0.27",
  "rapidfuzz>=3.10",
  "cryptography>=50.0.2",
  "wetext==0.1.8",
  "opencc-python-reimplemented>=0.1.7",
  "ldap3>=2.9,<3",
  "python-multipart>=0.0.33",
  "asyncssh>=2.24.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]
diarization-validation = [
    "intervaltree>=3.2.1",
    "pyannote-metrics>=4.2.0",
    "tabulate>=0.10.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["integration: 需要 PostgreSQL 的集成测试"]

[tool.mypy]
python_version = "3.13"
strict = true
